name: Run Jest Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "web/**"
      - "p2/contracts/**"
      - "p2/eval/**"
      - ".github/workflows/ci-jest.yml"
  push:
    branches:
      - main
      - se26f-p2
    paths:
      - "web/**"
      - "p2/contracts/**"
      - "p2/eval/**"
      - ".github/workflows/ci-jest.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm install

      # npm ci fails on this lock file under npm 11+: the committed lock is
      # missing the @swc/core platform binaries. Recorded in P1a evidence; until
      # the lock is regenerated, install is the only option that works.
      # next-env.d.ts is gitignored by Next's own convention, so CI does not have
      # the ambient declarations for image imports that a local checkout picks up
      # after the first dev or build run. Without this, tsc fails on CI while
      # passing locally — a false green. typegen needs no Supabase credentials.
      - name: Generate Next type declarations
        run: cd web && npx next typegen

      - name: Type-check
        run: cd web && npx tsc --noEmit

      # Style and format gates. ESLint uses web/eslint.config.mjs (next/core-web-vitals
      # + next/typescript); Prettier uses web/.prettierrc. Both fail the job on any finding.
      - name: Lint (ESLint)
        run: cd web && npx eslint . --max-warnings=0

      - name: Check formatting (Prettier)
        run: cd web && npx prettier --check .

      - name: Run Jest tests
        run: cd web && npm test

      # `next build` is the gate the plan asks for and it was missing. It needs six
      # variables, because several route modules construct clients or validate keys
      # at import time and page-data collection executes them:
      #   supabaseServer.ts:6         SUPABASE_SERVICE_ROLE_KEY
      #   notifications/vapid-key     the same, via supabaseServer
      #   achievements/check          web-push validates the VAPID public key is
      #                               65 bytes decoded, so a dummy string fails
      # All six are placeholders here. The VAPID pair is a freshly generated
      # keypair that is bound to no service; nothing in a build reaches the
      # network, and giving CI real credentials to compile a page would be worse.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder-service-role-key"
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: "BDXB2UbEvMFCx1P8O2CaK7pRgeNuL5QBa6rqlAYESC448Ly6E9GW_GQA_FeS4pmKQcD7Ufb-cVYbIDWwgBP7TBs"
          # Dummy key generated for CI builds only; not used by any deployment.
          VAPID_PRIVATE_KEY: "1Dh1tdAu9teQc3GPXmA_FfHKlZpdw3AtEOwxxCWingI"
          VAPID_SUBJECT: "mailto:ci@example.com"
        run: cd web && npx next build --no-lint

      - name: Run tests
        run: cd web && npx jest --coverage

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: web/coverage/lcov.info
          fail_ci_if_error: true
